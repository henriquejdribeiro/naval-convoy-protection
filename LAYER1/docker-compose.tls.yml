# =============================================================================
# LAYER1/docker-compose.tls.yml — the L1 TLS edge.
# One stunnel SERVER sidecar in front of ship-a's RPC: the endpoint the L2 side
# dials over mTLS to reach L1 (prover submit, l1-shim). Opt-in via -f.
#
# NOT standalone — it borrows two shared pieces from the files that own them:
#   • convoy-l1 network      → defined by LAYER1/docker-compose.l1.yml
#   • convoy-tls-certs volume → generated by LAYER2/docker-compose.tls.yml
# so this file declares NEITHER at top level (declare-once rule, see below).
# =============================================================================
services:
  convoy-tls-shipa:
    image: alpine:3.20
    container_name: convoy-tls-shipa          # == cert SAN; clients checkHost this exact name
    profiles: ["tls"]
    entrypoint: ["sh","-c","apk add --no-cache stunnel >/dev/null && exec sh /convoy-tls-entrypoint.sh"]
    environment:
      NODE: shipa                              # loads /tls/shipa.pem (SAN convoy-tls-shipa)
      SERVER_TUNNELS: "8545:ship-a:8545"       # accept TLS on :8545 → plaintext to ship-a:8545
    volumes:
      - ./LAYER2/tls/convoy-tls-entrypoint.sh:/convoy-tls-entrypoint.sh:ro
      - convoy-tls-certs:/tls:ro
    networks: [convoy-l1]
    restart: unless-stopped
    depends_on:
      convoy-tls-certs: { condition: service_completed_successfully }

  convoy-tls-shipf:
    image: alpine:3.20
    container_name: convoy-tls-shipf          # == cert SAN; the alpha leader checkHosts this
    profiles: ["tls"]
    entrypoint: ["sh","-c","apk add --no-cache stunnel >/dev/null && exec sh /convoy-tls-entrypoint.sh"]
    environment:
      NODE: shipf                              # loads /tls/shipf.pem (SAN convoy-tls-shipf)
      SERVER_TUNNELS: "8545:ship-f:8545"       # accept TLS :8545 → plaintext ship-f:8545 (alpha relay)
    volumes:
      - ./LAYER2/tls/convoy-tls-entrypoint.sh:/convoy-tls-entrypoint.sh:ro
      - convoy-tls-certs:/tls:ro
    networks: [convoy-l1]
    restart: unless-stopped
    depends_on:
      convoy-tls-certs: { condition: service_completed_successfully }

  convoy-tls-shipb:
    image: alpine:3.20
    container_name: convoy-tls-shipb          # == cert SAN; the bravo leader checkHosts this
    profiles: ["tls"]
    entrypoint: ["sh","-c","apk add --no-cache stunnel >/dev/null && exec sh /convoy-tls-entrypoint.sh"]
    environment:
      NODE: shipb                              # loads /tls/shipb.pem (SAN convoy-tls-shipb)
      SERVER_TUNNELS: "8545:ship-b:8545"       # accept TLS :8545 → plaintext ship-b:8545 (bravo relay)
    volumes:
      - ./LAYER2/tls/convoy-tls-entrypoint.sh:/convoy-tls-entrypoint.sh:ro
      - convoy-tls-certs:/tls:ro
    networks: [convoy-l1]
    restart: unless-stopped
    depends_on:
      convoy-tls-certs: { condition: service_completed_successfully }