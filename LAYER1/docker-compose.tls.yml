# =============================================================================
# LAYER1/docker-compose.tls.yml — the L1 TLS edge.
# One stunnel SERVER sidecar in front of ship-a's RPC: the endpoint the L2 side
# dials over mTLS to reach L1 (prover submit, l1-shim). Opt-in via -f.
#
# NOT standalone — it borrows two shared pieces from the files that own them:
#   • convoy-l1 network      → defined by LAYER1/docker-compose.l1.yml
#   • cert volumes per-node, factory-minted → generated by LAYER2/docker-compose.tls.yml
# so this file declares NEITHER at top level (declare-once rule, see below).
# =============================================================================
services:
  convoy-tls-shipd:
    image: alpine:3.20
    container_name: convoy-tls-shipd          # == cert SAN; clients checkHost this exact name
    profiles: ["tls"]
    entrypoint: ["sh","-c","apk add --no-cache stunnel >/dev/null && exec sh /convoy-tls-entrypoint.sh"]
    environment:
      NODE: shipd                              # loads /tls/shipd.pem (SAN convoy-tls-shipd)
      SERVER_TUNNELS: "8545:ship-d:8545"       # accept TLS :8545 → plaintext ship-d:8545 (commander)
    volumes:
      - ./LAYER2/tls/convoy-tls-entrypoint.sh:/convoy-tls-entrypoint.sh:ro
      - convoy-tls-shipd:/tls:ro
    networks: [convoy-l1]
    restart: unless-stopped

  convoy-tls-shipf:
    image: alpine:3.20
    container_name: convoy-tls-shipf          # == cert SAN; the alpha leader checkHosts this
    profiles: ["tls"]
    entrypoint: ["sh","-c","apk add --no-cache stunnel >/dev/null && exec sh /convoy-tls-entrypoint.sh"]
    environment:
      NODE: shipf                              # loads /tls/shipf.pem (SAN convoy-tls-shipf)
      SERVER_TUNNELS: "8545:ship-f:8545 9000:convoy-submitter-alpha:9000"  # accept TLS :8545 → plaintext ship-f:8545 (alpha relay)
    volumes:
      - ./LAYER2/tls/convoy-tls-entrypoint.sh:/convoy-tls-entrypoint.sh:ro
      - convoy-tls-shipf:/tls:ro
    networks: [convoy-l1]
    restart: unless-stopped

  convoy-tls-shipb:
    image: alpine:3.20
    container_name: convoy-tls-shipb          # == cert SAN; the bravo leader checkHosts this
    profiles: ["tls"]
    entrypoint: ["sh","-c","apk add --no-cache stunnel >/dev/null && exec sh /convoy-tls-entrypoint.sh"]
    environment:
      NODE: shipb                              # loads /tls/shipb.pem (SAN convoy-tls-shipb)
      SERVER_TUNNELS: "8545:ship-b:8545 9000:convoy-submitter-bravo:9000"       # accept TLS :8545 → plaintext ship-b:8545 (bravo relay)
    volumes:
      - ./LAYER2/tls/convoy-tls-entrypoint.sh:/convoy-tls-entrypoint.sh:ro
      - convoy-tls-shipb:/tls:ro
    networks: [convoy-l1]
    restart: unless-stopped

  convoy-submitter-alpha:
    image: convoy-prover-api:latest
    container_name: convoy-submitter-alpha
    profiles: ["tls"]
    entrypoint: ["/bin/sh","-c","export PRIVATE_KEY=\"$$(cat /key/evm_pk)\"; exec python3 /submit_receiver.py"]
    volumes:
      - ./PROOF/submitter/submit_receiver.py:/submit_receiver.py:ro
      - ship-f-key:/key:ro            # alpha relay EVM key, sealed on the ship
      - submissions-alpha:/submissions
    environment:
      SWARM: alpha
      URL: http://ship-f:8545         # LOCAL ship node — loopback, no TLS on this hop
      # the SAME STARK-suite + Verifier addresses now on prover-api-alpha (l2.yml:200-207):
      CONVOY_VERIFIER_ADDR:            "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
      GPS_STATEMENT_VERIFIER_ADDR:     "0xc6e7DF5E7b4f2A278906862b61205850344D4e7d"
      MERKLE_STATEMENT_CONTRACT_ADDR:  "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
      FRI_STATEMENT_CONTRACT_ADDR:     "0x5FC8d32690cc91D4c39d9d3abcBD16989F875707"
      MEMORY_PAGE_FACT_REGISTRY_ADDR:  "0x0165878A594ca255338adfa4d48449f69242Eb8F"
    networks: [convoy-l1]
    restart: unless-stopped

  convoy-submitter-bravo:
    image: convoy-prover-api:latest
    container_name: convoy-submitter-bravo
    profiles: ["tls"]
    entrypoint: ["/bin/sh","-c","export PRIVATE_KEY=\"$$(cat /key/evm_pk)\"; exec python3 /submit_receiver.py"]
    volumes:
      - ./PROOF/submitter/submit_receiver.py:/submit_receiver.py:ro
      - ship-b-key:/key:ro            # bravo relay EVM key, sealed on the ship
      - submissions-bravo:/submissions
    environment:
      SWARM: bravo
      URL: http://ship-b:8545         # LOCAL ship node — loopback, no TLS on this hop
      # the SAME STARK-suite + Verifier addresses now on prover-api-bravo (l2.yml:200-207):
      CONVOY_VERIFIER_ADDR:            "0xe7f1725E7734CE288F8367e1Bb143E90bb3F0512"
      GPS_STATEMENT_VERIFIER_ADDR:     "0xc6e7DF5E7b4f2A278906862b61205850344D4e7d"
      MERKLE_STATEMENT_CONTRACT_ADDR:  "0xDc64a140Aa3E981100a9becA4E685f962f0cF6C9"
      FRI_STATEMENT_CONTRACT_ADDR:     "0x5FC8d32690cc91D4c39d9d3abcBD16989F875707"
      MEMORY_PAGE_FACT_REGISTRY_ADDR:  "0x0165878A594ca255338adfa4d48449f69242Eb8F"
    networks: [convoy-l1]
    restart: unless-stopped

volumes:
  convoy-tls-shipd: { external: true, name: convoy-tls-shipd }   # in the volumes: block
  convoy-tls-shipf: { external: true, name: convoy-tls-shipf }
  convoy-tls-shipb: { external: true, name: convoy-tls-shipb }
  submissions-alpha: { name: convoy-submissions-alpha }
  submissions-bravo: { name: convoy-submissions-bravo }