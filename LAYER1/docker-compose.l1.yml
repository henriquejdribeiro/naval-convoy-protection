# =============================================================================
# L1 — Hyperledger Besu QBFT, 6 validators (ships A–F). Replaces the geth fleet.
# Same convoy-l1 aliases + ship-a:8545 so the L2 stack + scripts keep working.
# Static IPs so each node advertises a reachable P2P address (nat-method=DOCKER
# advertised 127.0.0.1 → no peers). Includes the deploy-l1 Foundry service.
#   docker compose -f docker-compose.l1.yml up -d
#   docker compose -f docker-compose.l1.yml --profile deploy run --rm deploy-l1
# =============================================================================

x-besu-base: &besu-base
  image: hyperledger/besu:26.7.1
  restart: unless-stopped

services:

  ship-a:
    <<: *besu-base
    container_name: convoy-ship-a
    hostname: ship-a
    volumes:
      - ./LAYER1/besu-l1/networkFiles/genesis.json:/config/genesis.json:ro
      - ship-a-node:/nodekey
      - ship-a-data:/data
      - ship-a-key:/key          # owner (anvil[0]) key — deploys/owns the L1 contracts
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/nodekey/key.priv
      - --data-path=/data
      - --nat-method=NONE
      - --p2p-host=172.28.0.11
      - --host-allowlist=*
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL,ADMIN
      - --rpc-http-cors-origins=*
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL
    ports:
      - "8545:8545"
      - "8546:8546"
    networks:
      convoy-l1:
        ipv4_address: 172.28.0.11

  ship-b:
    <<: *besu-base
    container_name: convoy-ship-b
    hostname: ship-b
    depends_on: [ship-a]
    volumes:
      - ./LAYER1/besu-l1/networkFiles/genesis.json:/config/genesis.json:ro
      - ship-b-node:/nodekey
      - ship-b-data:/data
      - ship-b-key:/key          # bravo relay — holds the swarm's deployer key
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/nodekey/key.priv
      - --data-path=/data
      - --nat-method=NONE
      - --p2p-host=172.28.0.12
      - --host-allowlist=*
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL,ADMIN
      - --rpc-http-cors-origins=*
      - --bootnodes=enode://2cae8e32243ae9742cc19486f2f3dce76c119ec6132743eee24f615711918261eaf3a460259d7faa7341f81233ea6056c0ad1e5dad2cef8fd68e0baa50abd0c3@172.28.0.11:30303
    networks:
      convoy-l1:
        ipv4_address: 172.28.0.12

  ship-c:
    <<: *besu-base
    container_name: convoy-ship-c
    hostname: ship-c
    depends_on: [ship-a]
    volumes:
      - ./LAYER1/besu-l1/networkFiles/genesis.json:/config/genesis.json:ro
      - ship-c-node:/nodekey
      - ship-c-data:/data
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/nodekey/key.priv
      - --data-path=/data
      - --nat-method=NONE
      - --p2p-host=172.28.0.13
      - --host-allowlist=*
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL,ADMIN
      - --rpc-http-cors-origins=*
      - --bootnodes=enode://2cae8e32243ae9742cc19486f2f3dce76c119ec6132743eee24f615711918261eaf3a460259d7faa7341f81233ea6056c0ad1e5dad2cef8fd68e0baa50abd0c3@172.28.0.11:30303
    networks:
      convoy-l1:
        ipv4_address: 172.28.0.13

  ship-d:
    <<: *besu-base
    container_name: convoy-ship-d
    hostname: ship-d
    depends_on: [ship-a]
    volumes:
      - ./LAYER1/besu-l1/networkFiles/genesis.json:/config/genesis.json:ro
      - ship-d-node:/nodekey
      - ship-d-data:/data
      - ship-d-key:/key          # commander (anvil[7]) key — signs Registry.deploy
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/nodekey/key.priv
      - --data-path=/data
      - --nat-method=NONE
      - --p2p-host=172.28.0.14
      - --host-allowlist=*
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL,ADMIN
      - --rpc-http-cors-origins=*
      - --bootnodes=enode://2cae8e32243ae9742cc19486f2f3dce76c119ec6132743eee24f615711918261eaf3a460259d7faa7341f81233ea6056c0ad1e5dad2cef8fd68e0baa50abd0c3@172.28.0.11:30303
    networks:
      convoy-l1:
        ipv4_address: 172.28.0.14

  ship-e:
    <<: *besu-base
    container_name: convoy-ship-e
    hostname: ship-e
    depends_on: [ship-a]
    volumes:
      - ./LAYER1/besu-l1/networkFiles/genesis.json:/config/genesis.json:ro
      - ship-e-node:/nodekey
      - ship-e-data:/data
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/nodekey/key.priv
      - --data-path=/data
      - --nat-method=NONE
      - --p2p-host=172.28.0.15
      - --host-allowlist=*
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL,ADMIN
      - --rpc-http-cors-origins=*
      - --bootnodes=enode://2cae8e32243ae9742cc19486f2f3dce76c119ec6132743eee24f615711918261eaf3a460259d7faa7341f81233ea6056c0ad1e5dad2cef8fd68e0baa50abd0c3@172.28.0.11:30303
    networks:
      convoy-l1:
        ipv4_address: 172.28.0.15

  ship-f:
    <<: *besu-base
    container_name: convoy-ship-f
    hostname: ship-f
    depends_on: [ship-a]
    volumes:
      - ./LAYER1/besu-l1/networkFiles/genesis.json:/config/genesis.json:ro
      - ship-f-node:/nodekey
      - ship-f-data:/data
      - ship-f-key:/key          # alpha relay — holds the swarm's deployer key
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/nodekey/key.priv
      - --data-path=/data
      - --nat-method=NONE
      - --p2p-host=172.28.0.16
      - --host-allowlist=*
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL,ADMIN
      - --rpc-http-cors-origins=*
      - --bootnodes=enode://2cae8e32243ae9742cc19486f2f3dce76c119ec6132743eee24f615711918261eaf3a460259d7faa7341f81233ea6056c0ad1e5dad2cef8fd68e0baa50abd0c3@172.28.0.11:30303
    networks:
      convoy-l1:
        ipv4_address: 172.28.0.16

  # ── Foundry deploy service (manual: --profile deploy) ────────────────────
  deploy-l1:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: convoy-deploy-l1
    profiles: ["deploy"]
    depends_on: [ship-a]
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    environment:
      FOUNDRY_PROFILE: default
      COMMANDER_ADDR:      "0x14dC79964da2C08b23698B3D3cc7Ca32193d9955"
      ALPHA_RELAY_ADDR:    "0x9965507D1a55bcC2695C58ba16FB37d819B0A4dc"
      BRAVO_RELAY_ADDR:    "0x70997970C51812dc3A010C7d01b50e0d17dc79C8"
      STARK_VERIFIER_ADDR: "0x959922be3caee4b8cd9a407cc3ac1c251c2007b1"
      STARKNET_CORE_ADDR_ALPHA: "${STARKNET_CORE_ADDR_ALPHA}"
      STARKNET_CORE_ADDR_BRAVO: "${STARKNET_CORE_ADDR_BRAVO}"
      CONVOY_SPEED:        "100"
    command:
      - |
        set -e
        echo "[deploy-l1] installing forge dependencies"
        mkdir -p lib
        [ -f lib/forge-std/src/Script.sol ] || git clone --depth 1 --branch v1.9.4 https://github.com/foundry-rs/forge-std lib/forge-std
        [ -f lib/openzeppelin-contracts/contracts/access/Ownable.sol ] || git clone --depth 1 --branch v5.0.2 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
        echo "[deploy-l1] building"
        forge build
        echo "[deploy-l1] deploying convoy contracts"
        forge script script/DeployL1.s.sol \
          --rpc-url http://ship-a:8545 \
          --private-key "$(cat /key/pk)" \
          --broadcast | tee /workspace/deploy-l1.log
        echo "[deploy-l1] L1 contracts deployed; run ./scripts/script4_register-missions.sh after L2 setup"
    volumes:
      - ./LAYER1/contracts_solidity:/workspace
      - ship-a-key:/key
    networks:
      - convoy-l1

volumes:
  ship-a-data:
  ship-b-data:
  ship-c-data:
  ship-d-data:
  ship-e-data:
  ship-f-data:
  ship-a-key:
    name: convoy-ship-a-key
  ship-b-key:
    name: convoy-ship-b-key
  ship-d-key:
    name: convoy-ship-d-key
  ship-f-key:
    name: convoy-ship-f-key
  ship-a-node:
    name: convoy-ship-a-node
  ship-b-node:
    name: convoy-ship-b-node
  ship-c-node:
    name: convoy-ship-c-node
  ship-d-node:
    name: convoy-ship-d-node
  ship-e-node:
    name: convoy-ship-e-node
  ship-f-node:
    name: convoy-ship-f-node

networks:
  convoy-l1:
    name: convoy-l1
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16