# =============================================================================
# convoy-devops — the single OPERATOR node.
#
# You start it with SIMULATOR/poc1/demo/scripts/script0_devops.sh (the only script
# you run on the host). On boot it runs DEVOPS/poc1/orchestrate_poc1.sh, which runs
# the whole PoC (script1 … script7) from INSIDE this container.
#
# How it reaches the host Docker daemon:
#   - /var/run/docker.sock is mounted → `docker run` / `docker compose` issued
#     here execute as SIBLING containers on the host daemon (docker-out-of-docker).
#   - The repo is mounted at its *HOST* path (${HOST_REPO_ROOT}), so every
#     `-v <hostpath>:/x` bind and `--project-directory .` the scripts use resolves
#     correctly on the host daemon. Named volumes (all the keys) need no mapping.
#   - Its own L1 health curls go to host.docker.internal:8545 (host-published),
#     so it needs no attachment to convoy-l1 (which script1 itself creates).
# =============================================================================
services:
  convoy-devops:
    image: convoy-devops:latest
    build:
      context: DEVOPS          # small build context (just the Dockerfile)
      dockerfile: Dockerfile
    container_name: convoy-devops
    user: root                    # needs to read the mounted docker.sock + write the repo
    working_dir: ${HOST_REPO_ROOT}
    command: ["bash", "DEVOPS/poc1/orchestrate_poc1.sh"]
    restart: "no"
    environment:
      HOST_REPO_ROOT: ${HOST_REPO_ROOT}
      # script1's health checks run from inside this container, so point them at
      # the host-published L1 RPC instead of localhost:
      URL: "http://host.docker.internal:8545"
      L1_HEALTH_URL: "http://host.docker.internal:8545"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - type: bind
        source: .
        target: ${HOST_REPO_ROOT}
      - /var/run/docker.sock:/var/run/docker.sock      # talk to the host daemon
  
  convoy-tls-devops:
    image: alpine:3.20
    container_name: convoy-tls-devops
    profiles: ["tls"]                      # only comes up with the TLS mesh
    entrypoint: ["sh","-c","apk add --no-cache stunnel >/dev/null && exec sh /convoy-tls-entrypoint.sh"]
    environment:
      NODE: devops
      CLIENT_TUNNELS: "19944:convoy-tls-node1:9444 29944:convoy-tls-node1b:9444 18545:convoy-tls-shipd:8545"
    volumes:
      - ./LAYER2/tls/convoy-tls-entrypoint.sh:/convoy-tls-entrypoint.sh:ro
      - convoy-tls-devops:/tls:ro
    networks: [convoy-l1]
    restart: unless-stopped

  # ── L1 contract deploy — the factory's one-shot forge job (--profile deploy).
  #    Spawned by script1 from inside convoy-devops; signs with the owner key held
  #    in the factory's OWN volume, submits to ship D's RPC.
  deploy-l1:
    image: ghcr.io/foundry-rs/foundry:latest
    container_name: convoy-deploy-l1
    profiles: ["deploy"]
    working_dir: /workspace
    entrypoint: ["/bin/sh", "-c"]
    environment:
      FOUNDRY_PROFILE: default
      COMMANDER_ADDR:      "${COMMANDER_ADDR}"
      ALPHA_RELAY_ADDR:    "${ALPHA_RELAY_ADDR}"
      BRAVO_RELAY_ADDR:    "${BRAVO_RELAY_ADDR}"
      STARK_VERIFIER_ADDR: "0x959922be3caee4b8cd9a407cc3ac1c251c2007b1"
      STARKNET_CORE_ADDR_ALPHA: "${STARKNET_CORE_ADDR_ALPHA}"
      STARKNET_CORE_ADDR_BRAVO: "${STARKNET_CORE_ADDR_BRAVO}"
      CONVOY_SPEED:        "100"
    command:
      - |
        set -e
        echo "[deploy-l1] installing forge dependencies"
        mkdir -p lib
        [ -f lib/forge-std/src/Script.sol ] || git clone --depth 1 --branch v1.9.4 https://github.com/foundry-rs/forge-std lib/forge-std
        [ -f lib/openzeppelin-contracts/contracts/access/Ownable.sol ] || git clone --depth 1 --branch v5.0.2 https://github.com/OpenZeppelin/openzeppelin-contracts lib/openzeppelin-contracts
        echo "[deploy-l1] building"
        forge build
        echo "[deploy-l1] deploying convoy contracts"
        forge script script/DeployL1.s.sol \
          --rpc-url http://ship-d:8545 \
          --private-key "$(cat /key/pk)" \
          --broadcast | tee /workspace/deploy-l1.log
        echo "[deploy-l1] L1 contracts deployed; run script4_register-missions.sh after L2 setup"
    volumes:
      - ./LAYER1/contracts_solidity:/workspace
      - convoy-devops-key:/key
    networks:
      - convoy-l1

volumes:
    convoy-tls-devops: { external: true, name: convoy-tls-devops }
    convoy-devops-key: { external: true, name: convoy-devops-key }
networks:
    convoy-l1: { external: true }
