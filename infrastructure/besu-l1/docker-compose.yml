# =============================================================================
# Besu QBFT L1 — 6 validators (ships A–F). Static IPs so each node advertises a
# reachable P2P address (nat-method=DOCKER advertised 127.0.0.1 → no peers).
#   docker compose -f infrastructure/besu-l1/docker-compose.yml up -d
# =============================================================================

x-besu-base: &besu-base
  image: hyperledger/besu:26.7.1
  restart: unless-stopped

services:

  ship-a:
    <<: *besu-base
    container_name: convoy-ship-a
    hostname: ship-a
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./networkFiles/keys/0x1b8926a8193ec65c3d011304bd8240bbb30cfbe3/key.priv:/config/key.priv:ro
      - ship-a-data:/data
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key.priv
      - --data-path=/data
      - --nat-method=NONE
      - --p2p-host=172.28.0.11
      - --host-allowlist=*
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL,ADMIN
      - --rpc-http-cors-origins=*
      - --rpc-ws-enabled
      - --rpc-ws-host=0.0.0.0
      - --rpc-ws-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL
    ports:
      - "8545:8545"
      - "8546:8546"
    networks:
      convoy-l1:
        ipv4_address: 172.28.0.11

  ship-b:
    <<: *besu-base
    container_name: convoy-ship-b
    hostname: ship-b
    depends_on: [ship-a]
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./networkFiles/keys/0x2f7b6c28cd816229d02825e131fd1b7b5ed35a3d/key.priv:/config/key.priv:ro
      - ship-b-data:/data
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key.priv
      - --data-path=/data
      - --nat-method=NONE
      - --p2p-host=172.28.0.12
      - --host-allowlist=*
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL,ADMIN
      - --rpc-http-cors-origins=*
      - --bootnodes=enode://2cae8e32243ae9742cc19486f2f3dce76c119ec6132743eee24f615711918261eaf3a460259d7faa7341f81233ea6056c0ad1e5dad2cef8fd68e0baa50abd0c3@172.28.0.11:30303
    networks:
      convoy-l1:
        ipv4_address: 172.28.0.12

  ship-c:
    <<: *besu-base
    container_name: convoy-ship-c
    hostname: ship-c
    depends_on: [ship-a]
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./networkFiles/keys/0x9a26fd747265b0c4abd15e8d8ad9e493c15efcce/key.priv:/config/key.priv:ro
      - ship-c-data:/data
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key.priv
      - --data-path=/data
      - --nat-method=NONE
      - --p2p-host=172.28.0.13
      - --host-allowlist=*
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL,ADMIN
      - --rpc-http-cors-origins=*
      - --bootnodes=enode://2cae8e32243ae9742cc19486f2f3dce76c119ec6132743eee24f615711918261eaf3a460259d7faa7341f81233ea6056c0ad1e5dad2cef8fd68e0baa50abd0c3@172.28.0.11:30303
    networks:
      convoy-l1:
        ipv4_address: 172.28.0.13

  ship-d:
    <<: *besu-base
    container_name: convoy-ship-d
    hostname: ship-d
    depends_on: [ship-a]
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./networkFiles/keys/0x9cbbfd6876318aff280535a395dad1b07eac352c/key.priv:/config/key.priv:ro
      - ship-d-data:/data
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key.priv
      - --data-path=/data
      - --nat-method=NONE
      - --p2p-host=172.28.0.14
      - --host-allowlist=*
      - --min-gas-price=0
