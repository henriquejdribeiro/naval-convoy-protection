      - --rpc-http-cors-origins=*
      - --bootnodes=enode://2cae8e32243ae9742cc19486f2f3dce76c119ec6132743eee24f615711918261eaf3a460259d7faa7341f81233ea6056c0ad1e5dad2cef8fd68e0baa50abd0c3@172.28.0.11:30303
    networks:
      convoy-l1:
