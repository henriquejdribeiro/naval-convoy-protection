  ship-e:
    <<: *besu-base
    container_name: convoy-ship-e
    hostname: ship-e
    depends_on: [ship-a]
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./networkFiles/keys/0xc41fb2e0dde63b7ea181cc65fd37a129ad8ad93a/key.priv:/config/key.priv:ro
      - ship-e-data:/data
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key.priv
      - --data-path=/data
      - --nat-method=NONE
      - --p2p-host=172.28.0.15
      - --host-allowlist=*
      - --min-gas-price=0
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL,ADMIN
      - --rpc-http-cors-origins=*
      - --bootnodes=enode://2cae8e32243ae9742cc19486f2f3dce76c119ec6132743eee24f615711918261eaf3a460259d7faa7341f81233ea6056c0ad1e5dad2cef8fd68e0baa50abd0c3@172.28.0.11:30303
    networks:
      convoy-l1:
        ipv4_address: 172.28.0.15

  ship-f:
    <<: *besu-base
    container_name: convoy-ship-f
    hostname: ship-f
    depends_on: [ship-a]
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./networkFiles/keys/0xd211edae231b5ec240035cf56e8cd302bd5d0879/key.priv:/config/key.priv:ro
      - ship-f-data:/data
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key.priv
