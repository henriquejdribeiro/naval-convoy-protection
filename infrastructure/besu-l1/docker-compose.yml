services:
  besu-l1:
    image: hyperledger/besu:26.7.1
    container_name: besu-l1
    ports: ["8545:8545", "8546:8546"]
    volumes:
      - ./networkFiles/genesis.json:/config/genesis.json:ro
      - ./key:/config/key:ro
      - besu-data:/data
    command:
      - --genesis-file=/config/genesis.json
      - --node-private-key-file=/config/key
      - --data-path=/data
      - --rpc-http-enabled
      - --rpc-http-host=0.0.0.0
      - --rpc-http-api=ETH,NET,WEB3,QBFT,DEBUG,TXPOOL
      - --rpc-http-cors-origins=*
      - --host-allowlist=*
      - --min-gas-price=0
volumes:
  besu-data: