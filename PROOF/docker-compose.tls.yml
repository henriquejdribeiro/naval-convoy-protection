# L2↔L1 proof/order bridge (mTLS). ADD-ON to LAYER2/docker-compose.tls.yml,
# which owns the CA + cert volume + the L2 leader sidecars this file extends.
# Always run BOTH files together (see run command below).
x-convoy-tls-bridge: &tls-bridge
  image: alpine:3.20
  profiles: ["tls"]
  entrypoint: ["sh","-c","apk add --no-cache stunnel >/dev/null && exec sh /convoy-tls-entrypoint.sh"]
  volumes:
    - ./LAYER2/tls/convoy-tls-entrypoint.sh:/convoy-tls-entrypoint.sh:ro
    - convoy-tls-certs:/tls:ro
  networks: [convoy-l1]
  restart: unless-stopped
  depends_on:
    convoy-tls-certs: { condition: service_completed_successfully }

services:
  # inject the L1-client tunnel onto the L2 leaders (merges with their LAYER2 def)
  convoy-tls-node1:  { environment: { CLIENT_TUNNELS: "15545:convoy-tls-shipa:8545" } }
  convoy-tls-node1b: { environment: { CLIENT_TUNNELS: "15545:convoy-tls-shipa:8545" } }

  prover-api-alpha:
    environment: { GETH_RPC_URL: "http://convoy-tls-node1:15545",  URL: "http://convoy-tls-node1:15545" }
  prover-api-bravo:
    environment: { GETH_RPC_URL: "http://convoy-tls-node1b:15545", URL: "http://convoy-tls-node1b:15545" }
  l1-shim:
    environment: { BESU_UPSTREAM: "http://convoy-tls-node1:15545" }

volumes:
  convoy-tls-certs: { external: true, name: convoy-tls-certs }
networks:
  convoy-l1: { external: true }